services:
    backend:
        build:
            context: ../backend/vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: phpeste-backend/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment: &backend-env
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '../backend:/var/www/html'
        networks:
            - phpeste
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost/up']
            interval: 10s
            retries: 6
            timeout: 5s
            start_period: 30s

    horizon:
        build:
            context: ../backend/vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: phpeste-backend/app
        environment: *backend-env
        volumes:
            - '../backend:/var/www/html'
        networks:
            - phpeste
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        entrypoint: ['php', '/var/www/html/artisan', 'horizon']
        healthcheck:
            test: ['CMD', 'php', '/var/www/html/artisan', 'horizon:status']
            interval: 15s
            retries: 6
            timeout: 5s
            start_period: 20s

    scheduler:
        build:
            context: ../backend/vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: phpeste-backend/app
        environment: *backend-env
        volumes:
            - '../backend:/var/www/html'
        networks:
            - phpeste
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        entrypoint: ['php', '/var/www/html/artisan', 'schedule:work']

    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'phpeste-mysql:/var/lib/mysql'
        networks:
            - phpeste
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'phpeste-redis:/data'
        networks:
            - phpeste
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - phpeste

networks:
    phpeste:
        driver: bridge

volumes:
    phpeste-mysql:
        driver: local
    phpeste-redis:
        driver: local
